name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The repository is public: fail on internal identifiers, runbooks and credentials.
      - name: Public-tree guard
        run: node scripts/check-public-tree.mjs

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npm run lint

      # the MCP App view is a build output; the protocol test reads it
      - name: Build MCP App view
        run: npm run build:mcp-app

      - name: Unit tests
        run: npm test
