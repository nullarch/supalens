# Supalens web server only — for operators who bring their OWN Supabase project (cloud or
# self-hosted) instead of the bundled one in docker-compose.yml.
#
#   cp .env.example .env      # fill in sections 1–3 with your project's values
#   npm run db:link && npm run db:push   # apply the schema to your project
#   docker compose -f docker-compose.external.yml up --build -d
#
# Agents and scheduled jobs still run inside this container. To run them on Trigger.dev instead,
# set SUPALENS_TASK_BACKEND=trigger plus the TRIGGER_* variables and `npm run trigger:deploy`
# (docs/self-hosting.md, "Advanced").
#
# Because sign-up is controlled by YOUR Supabase project here, turn "Allow new users to sign up"
# off in its Authentication settings — the app creates accounts itself.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPALENS_EDITION: selfhost
        SUPALENS_TASK_BACKEND: ${SUPALENS_TASK_BACKEND:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
        NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-}
        NEXT_PUBLIC_TRIGGER_API_URL: ${NEXT_PUBLIC_TRIGGER_API_URL:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    # Lets a database on the Docker host be reached as host.docker.internal (Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
